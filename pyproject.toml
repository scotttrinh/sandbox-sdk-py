[project]
name = "sandbox-sdk"
version = "0.1.0"
description = "Generic Python SDK for sandboxed environments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sandbox SDK Contributors" }]
dependencies = [
    "anyio>=4.0.0",
    "typing-extensions>=4.8.0",
]

[project.optional-dependencies]
docker = [
    "docker>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "docker>=7.0.0",
    "hypothesis>=6.100.0",
    "poethepoet>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "ty>=0.0.78",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "RUF",     # Ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.poe.tasks]
lint = "ruff check src tests"
format = "ruff format --check src tests"
typecheck = "ty check src"
test = "pytest"
check = ["lint", "format", "typecheck", "test"]
